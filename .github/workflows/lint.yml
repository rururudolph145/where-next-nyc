name: lint

on:
  pull_request:
    branches:
      - dev_MVP
      - main
  push:
    branches:
      - dev_MVP
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --dev --no-install-package torch --no-install-package torchvision
      - name: "Lint: ruff check"
        run: uv run ruff check .
      - name: "Lint: ruff format"
        run: uv run ruff format --check .
      - name: "Lint: mypy"
        run: uv run mypy app tests
