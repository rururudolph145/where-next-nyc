# Airflow 2.10 + LocalExecutor stack for experimentation.
#
# Target: `docker compose -f docker-compose-LocalExecutor.yml up --build` boots
# Airflow, the UI is reachable at http://localhost:8081, and the admin
# user (airflow/airflow) can log in.
#
# EXP-02 fattened this from the stock image to a custom `build: .` image (bakes
# the ingest deps) and added the app/ + raw-data + config mounts so the ingest
# DAG can run the real Ingestion against the read-only 2021 raw data, writing
# bronze into the isolated experiment data root. See Dockerfile.

x-airflow-common: &airflow-common
  # EXP-02: build a custom image that bakes the ingest deps (pandas/pyarrow/…)
  # instead of pulling the stock image. See Dockerfile + requirements-exp.txt.
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: _1SMIc_GNDsSCrFhDPm3iAF7klPcEZoH0Wibn-gh7gE=
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
    # EXP-02: app/ is bind-mounted (not baked); put the repo root on the path so
    # `import app.ingestion.ingest` and `import app.core.config` resolve.
    PYTHONPATH: /opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data  # EXP-01: watermark control file lives here
    # EXP-02 mounts (all read-only except the writable bronze root below):
    - ../app:/opt/airflow/app:ro  # real Ingestion code, host edits picked up live
    - ../config.yml:/opt/airflow/config.yml:ro  # seed/slice/schema values only
    # Read-only raw INPUT. Mounted as a child of ./data — the :ro child mount
    # protects the 340MB source while the parent watermark dir stays writable.
    - ../data/raw:/opt/airflow/data/raw:ro
    # Writable bronze OUTPUT, isolated from the production data/ tree.
    - ./data:/opt/airflow/data_exp
    # EXP-03b: read-only shapefile mount for add_zone_coordinates.
    # All four sidecar files (.shp/.shx/.dbf/.prj) must be present in data/reference/.
    - ../data/reference:/opt/airflow/data/reference:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
