[project]
name = "new-york-taxi-demand-forecasting"
version = "0.1.0"
description = "New York Taxi Demand Forecasting"
requires-python = ">=3.13"
dependencies = [
    # Data
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",       # read/write parquet (NYC taxi data format)
    "scikit-learn>=1.6",
    # Time-series & forecasting
    "statsmodels>=0.14",
    "xgboost>=2.1",
    "lightgbm>=4.5",
    "optuna>=4.0",         # hyperparameter tuning
    # Deep learning
    "torch>=2.6",
    "torchvision>=0.21",
    # Visualisation
    "matplotlib>=3.10",
    "seaborn>=0.13",
    # Notebooks & dev
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "tqdm>=4.67",
    "dask>=2026.1.2",
    "gpxpy>=1.6.2",
    "ruff>=0.15.4",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "fastapi>=0.136.0",
    "uvicorn>=0.34.0",
    "mlflow>=3.11.1",
    "pandera>=0.20",
    "pydantic>=2",
]

[tool.pytest.ini_options]
pythonpath = ["orchestration/lib", "tests"]
addopts = [
    "--cov=app",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
markers = [
    "integration: requires container + MLflow; skipped in default host CI",
]

[tool.coverage.run]
branch = false
omit = [
    "app/**/__init__.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]

[tool.mypy]
exclude = ["orchestration/dags_uid50000_bak/"]

[[tool.mypy.overrides]]
module = [
    "airflow.*",
    "airflow",
    "pendulum",
    "pendulum.*",
]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["experiment", "*.ipynb"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pandas-stubs>=3.0.0.260204",
    "pytest>=9.0.3",
    "pytest-cov>=5.0",
    "types-geopandas>=1.1.3.20260408",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]
