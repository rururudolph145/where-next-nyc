env: local  # local | cloud

data:
  train_path: data/train.parquet
  test_path: data/test.parquet
  bronze_path: data/bronze/yellow_tripdata_2022-01-01_2022-01-14.parquet
  silver_path: data/silver/yellow_tripdata_cleaned.parquet

clean:
  null_strategy: drop  # drop | ffill | bfill

train:
  test_size: 0.2
  random_state: 42
  shuffle: true

model:
  name: LGBMRegressor
  params:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 31
    random_state: 42
  store_path: models/
