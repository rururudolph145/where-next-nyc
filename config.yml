env: local  # local | cloud

ingest:
  start_year_month: "2021-01"
  end_year_month: "2021-03"
  max_workers: 8  # ThreadPoolExecutor size for parallel parquet reads
  # PBI 25b FIX — incremental-pipeline watermark over the fixed 2021 data.
  # seed_start is the LOWER bound of the cumulative ingest window (naive ISO,
  # NO 'Z': tpep_pickup_datetime is tz-naive NYC wall-clock). The window's
  # upper bound advances by slice_duration each DAG run, so bronze grows
  # monotonically. slice_duration MUST equal feature.bucket.
  seed_start: "2021-01-18T00:00:00"  # 3rd week of Jan 2021
  slice_duration: "15min"
  bronze_schema:
    VendorID: float64
    tpep_pickup_datetime: datetime64[us]
    tpep_dropoff_datetime: datetime64[us]
    passenger_count: float64
    trip_distance: float64
    RatecodeID: float64
    store_and_fwd_flag: str
    PULocationID: float64
    DOLocationID: float64
    payment_type: float64
    fare_amount: float64
    extra: float64
    mta_tax: float64
    tip_amount: float64
    tolls_amount: float64
    improvement_surcharge: float64
    total_amount: float64
    congestion_surcharge: float64
    airport_fee: float64

data:
  raw_path: data/raw/yellow_tripdata
  train_path: data/train.parquet
  test_path: data/test.parquet
  bronze_path: data/bronze/yellow_tripdata/bronze.parquet
  silver_path: data/silver/yellow_tripdata_cleaned.parquet
  gold_path: data/gold/yellow_tripdata

feature:
  bucket: "15min"  # aggregation bucket width (pandas offset alias). PBI B2: 15-min refresh. "30min" = B1 nowcast, "h" = legacy hourly.
  lags: [1, 2, 4, 8, 12, 24, 96, 672]  # lag offsets in *buckets*. Under bucket="15min": 15min, 30min, 1h, 2h, 3h, 6h, 1d, 1w.
  horizon_buckets: 0  # PBI A3: single-bucket forecast horizon. 0 = disabled. Generates ``target_t{N}`` when > 0. Mutually independent of horizon_sum_buckets.
  horizon_sum_buckets: 2  # PBI B2: sum of next N future buckets as target. Under bucket="15min" with N=2 → 30-min lookahead = demand[t+15..t+30) + demand[t+30..t+45). Generates ``target_sum_t1_t{N}`` when > 0.
  n_neighbors: 5  # PBI B1: k for spatial smoothing of trip_count_lag_1. 0 disables and reverts to legacy schema.
  zone_shapefile_path: data/reference/taxi_zones.shp

clean:
  null_strategy: drop  # drop | ffill | bfill
  null_subset:         # columns to check for nulls (empty = all columns)
    - tpep_pickup_datetime
    - tpep_dropoff_datetime
    - passenger_count
    - trip_distance
    - fare_amount
    - PULocationID
    - DOLocationID

train:
  gate:
    min_wape_lift_pct: 2.0  # Minimum WAPE lift % to promote challenger to Production
  split_ratios: [0.8, 0.1, 0.1]  # train / val / test
  features:
    - hour_of_day_sin
    - hour_of_day_cos
    - day_of_week_sin
    - day_of_week_cos
    - month_sin
    - month_cos
    - pickup_longitude
    - pickup_latitude
    - trip_count_lag_1     # 15 min ago
    - trip_count_lag_2     # 30 min ago
    - trip_count_lag_4     # 1 h ago
    - trip_count_lag_8     # 2 h ago
    - trip_count_lag_12    # 3 h ago
    - trip_count_lag_24    # 6 h ago
    - trip_count_lag_96    # 1 day ago
    - trip_count_lag_672   # 1 week ago
    - trip_count_lag_1_neighbor_mean  # PBI B1: spatial smoothing
  target: target_sum_t1_t2   # PBI B2: 30-min lookahead = sum of next two 15-min bins

model:
  name: LGBMRegressor
  params:
    n_estimators: 500
    learning_rate: 0.05
    max_depth: -1
    num_leaves: 31
    random_state: 42
    verbosity: -1
  store_path: models/

inference:
  output_path: data/predictions/demand_predictions.parquet
  simulation:
    start_hour: "2021-03-01 00:00:00"
    end_hour: "2021-03-02 23:00:00"

serving:
  predictions_path: data/predictions/demand_predictions.parquet
  zone_shapefile_path: data/reference/taxi_zones.shp

monitoring:
  predictions_path: data/monitoring/predictions
  joined_path: data/monitoring/joined

mlflow:
  experiment_name: ny_taxi_demand_model
  tracking_uri: sqlite:///data/mlflow.db
  model_name: ny_taxi_demand_model
