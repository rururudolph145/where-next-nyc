# Minimal Airflow stack for the 15-min inference simulation experiment.
# Based on the official quick-start compose file, trimmed to LocalExecutor
# (no Redis, no Celery worker, no Flower) for simplicity.
#
# Usage:
#   cd experiment/orchestration
#   cp .env.example .env  # then edit AIRFLOW_UID
#   docker compose up airflow-init
#   docker compose up -d
#   open http://localhost:8080   # admin / admin
#
# To stop: docker compose down
# To wipe everything (incl. Postgres state): docker compose down -v

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Make the project root importable so the DAG can `from app.inference...`
    PYTHONPATH: "/opt/airflow/project"
    # Tunables surfaced to the DAG
    INFERENCE_REAL_SLEEP_SECONDS: "${INFERENCE_REAL_SLEEP_SECONDS:-5}"
    INFERENCE_STATE_DIR: "/opt/airflow/state"
    INFERENCE_API_BASE_URL: "${INFERENCE_API_BASE_URL:-http://host.docker.internal:8000}"
    # Extra Python deps the project needs at runtime
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas==2.2.* pyarrow==17.* joblib==1.4.* lightgbm==4.5.* scikit-learn==1.5.* requests==2.32.* pyyaml==6.* numpy==1.26.*"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./state:/opt/airflow/state
    # Mount the project root read-only so DAGs can import app.* and read data/models
    - ../..:/opt/airflow/project:rw
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"  # so the API smoke-test can reach uvicorn on the host
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname Admin \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
