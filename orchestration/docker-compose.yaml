# Airflow 2.10.3 LocalExecutor stack for 15_minute_refresh_inference_dag.
#
# Boot with `make airflow-init` then `make airflow-up`. UI at
# http://localhost:8081 (default creds: airflow/airflow).
#
# Path map (relative to this file):
#   ./dags     -> /opt/airflow/dags            (DAG-scanned)
#   ./lib      -> /opt/airflow/lib             (non-DAG-scanned helpers, on PYTHONPATH)
#   ./logs     -> /opt/airflow/logs
#   ../app     -> /opt/airflow/app             (read-only, host edits picked up live)
#   ../config.yml -> /opt/airflow/config.yml   (read-only)
#   ../data    -> /opt/airflow/data            (writable -- canonical output tree)
#   ../data/raw -> /opt/airflow/data/raw       (read-only child within data/)
#   ../data/reference -> /opt/airflow/data/reference (read-only child)

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: _1SMIc_GNDsSCrFhDPm3iAF7klPcEZoH0Wibn-gh7gE=
    AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'True'
    PYTHONPATH: /opt/airflow:/opt/airflow/lib
  volumes:
    - ./dags:/opt/airflow/dags
    - ./lib:/opt/airflow/lib
    - ./logs:/opt/airflow/logs
    - ../app:/opt/airflow/app:ro
    - ../config.yml:/opt/airflow/config.yml:ro
    - ../data:/opt/airflow/data
    - ../data/raw:/opt/airflow/data/raw:ro
    - ../data/reference:/opt/airflow/data/reference:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
